<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Planner · پلنر زندگی</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/* Layout: one app, three tabs (Habits, Money, Sleep). Shared header + period bar. Logical CSS properties so Persian (RTL) mirrors correctly. */
:root{
  --bg:#eceef4; --paper:#f8f9fc; --band:#17244a; --band-fg:#f2f4fb; --ink:#17244a; --muted:#66718e;
  --line:#cdd2e0; --cell:#ffffff; --accent:#2f5bd8; --gold:#b8934a; --today:#e0e8ff; --good:#2a8a5b; --warn:#c0741c; --bad:#b83a4b;
  --f-display:'Cormorant Garamond','Aref Ruqaa',Georgia,serif;
  --f-body:'Jost','Vazirmatn',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','Vazirmatn',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1c; --paper:#111a2e; --band:#1f315b; --band-fg:#eef2fb; --ink:#e7ecf8; --muted:#8e9ab8;
  --line:#28345a; --cell:#0e1527; --accent:#86a0ff; --gold:#d6b370; --today:#1b2a52; --good:#4cc38a; --warn:#e5a553; --bad:#f07a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1c; --paper:#111a2e; --band:#1f315b; --band-fg:#eef2fb; --ink:#e7ecf8; --muted:#8e9ab8;
  --line:#28345a; --cell:#0e1527; --accent:#86a0ff; --gold:#d6b370; --today:#1b2a52; --good:#4cc38a; --warn:#e5a553; --bad:#f07a8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[lang="fa"] *{letter-spacing:0 !important}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.mono,.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:700}
.band{background:var(--band);color:var(--band-fg)}
.panel{background:var(--paper);border:1px solid var(--line);min-width:0}
.hd{padding:9px 14px;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.06em}
html[lang="fa"] .hd{font-size:19px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--cell);padding:8px 12px;font-weight:500;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--band);color:var(--band-fg);border-color:var(--band)}
button.on{background:var(--band);color:var(--band-fg);border-color:var(--band)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text],input[type=time]{background:var(--cell);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.brand h1{margin:0;font-family:var(--f-display);font-size:38px;font-weight:700}
html[lang="fa"] .brand h1{font-size:34px;font-weight:700;line-height:1.3}
.brand span{color:var(--gold);font-family:var(--f-display);font-size:15px;letter-spacing:.28em;text-transform:uppercase;font-weight:600}
html[lang="fa"] .brand span{letter-spacing:0;font-size:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);background:var(--paper)}
.tabs button{border:0;border-radius:0;padding:12px 8px;font-family:var(--f-display);font-size:20px;font-weight:700;background:transparent}
html[lang="fa"] .tabs button{font-size:18px}
.tabs button+button{border-inline-start:1px solid var(--line)}
.tabs button.on{background:var(--band);color:var(--band-fg)}
.period{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.period select{width:auto;min-width:110px;font-weight:500}
.period .sp{flex:1}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--today);border:1px solid var(--line);padding:10px 14px;font-size:14px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0}
.kpis>div{padding:14px;border-inline-start:1px solid var(--line)}
.kpis>div:first-child{border-inline-start:0}
.kpis b{display:block;font:500 24px var(--f-mono)}
.kpis span{font-size:12px;color:var(--muted)}
.kpis small{display:block;color:var(--muted);font-size:11px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pad{padding:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.chart{direction:ltr;display:block;width:100%;height:auto}
.c-axis{fill:var(--muted);font:10px var(--f-mono)}
.c-grid{stroke:var(--line);stroke-width:1}
.c-bar{fill:var(--accent)} .c-bar.today{fill:var(--gold)}
.c-lab{fill:var(--muted);font:9px var(--f-mono)}
.c-in{fill:var(--good)} .c-ex{fill:var(--warn)} .c-cap{fill:var(--accent)}

/* habits grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
.g th,.g td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.g thead th{background:var(--band);color:var(--band-fg);font:500 11px var(--f-mono);height:22px;border-color:#ffffff1f}
.g thead th.wk{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.1em}
.g thead th.today{background:var(--gold);color:#1b1b1b}
.g .nm{position:sticky;inset-inline-start:0;z-index:2;min-width:180px;max-width:180px;background:var(--band);color:var(--band-fg);text-align:start;border-color:#ffffff1f}
.g thead .nm{z-index:3;font:700 22px var(--f-display);text-align:center}
.nm .cellin{display:flex;align-items:center}
.nm input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:500 14px var(--f-body);padding:9px 8px}
.nm .del{border:0;background:transparent;color:inherit;opacity:0;padding:4px 8px}
tr:hover .nm .del,.nm .del:focus-visible{opacity:.75}
@media(hover:none){.nm .del{opacity:.6}}
td.d{width:28px;min-width:28px;height:32px;background:var(--cell)}
td.d.today{background:var(--today)}
td.d input[type=checkbox]{appearance:none;-webkit-appearance:none;width:17px;height:17px;margin:0;border:1.5px solid var(--ink);background:transparent;cursor:pointer;display:block;margin-inline:auto;position:relative;border-radius:3px}
td.d input[type=checkbox]:checked{background:var(--ink)}
td.d input[type=checkbox]:checked::after{content:"";position:absolute;left:4.5px;top:0;width:4px;height:9px;border:solid var(--cell);border-width:0 2px 2px 0;transform:rotate(45deg)}
td.d input.v{width:27px;border:0;background:transparent;font:12px var(--f-mono);text-align:center;padding:7px 0}
tr.add td{padding:6px 8px;background:var(--paper)}
tr.add .nm{background:var(--paper);color:var(--ink)}
.chartscroll{overflow-x:auto}.chartscroll .chart{min-width:640px}
tr.add button{border-style:dashed}
.bottom{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.bottom{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table.a{border-collapse:collapse;width:100%;font-size:13px}
.a th{font-weight:600;font-size:11px;color:var(--muted);text-align:end;padding:8px 10px;border-bottom:1px solid var(--line)}
.a td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:end;font-family:var(--f-mono)}
.a th:first-child,.a td:first-child{text-align:start}
.a td:first-child{font-family:var(--f-body);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;background:var(--line);min-width:80px;position:relative;border-radius:5px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
html[dir="rtl"] .bar i{inset:0 0 0 auto}
.right{display:grid;gap:14px;align-content:start}
.donutbody{display:flex;align-items:center;gap:16px;padding:14px;flex-wrap:wrap}
.legend{display:grid;gap:6px;font-size:14px}
.legend b{font:500 18px var(--f-mono)}
.sw{display:inline-block;width:10px;height:10px;margin-inline-end:6px;border-radius:2px}
.donut-bg{stroke:var(--line)} .donut-fg{stroke:var(--accent)}
ol.rank{list-style:none;margin:0;padding:4px 0}
ol.rank li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);align-items:center}
ol.rank li:last-child{border:0}
ol.rank .r{font:500 12px var(--f-mono);color:var(--muted)}
ol.rank .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* money */
.txform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.txform label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
table.tx{border-collapse:collapse;width:100%;font-size:14px}
.tx td,.tx th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
.tx th{font-size:12px;color:var(--muted);font-weight:600}
.tx .amt{text-align:end;font-family:var(--f-mono);white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;font-size:12px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.income{color:var(--good)} .pill.expense{color:var(--warn)} .pill.capital{color:var(--accent)}
.catrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:6px 14px;font-size:13px}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.empty{padding:20px 14px;color:var(--muted)}

/* sleep */
table.rec{border-collapse:collapse;width:100%;font-size:14px}
.rec td,.rec th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start}
.rec tr.me td{background:var(--today);font-weight:600}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.times div{border:1px solid var(--line);background:var(--cell);padding:10px;text-align:center}
.times div.best{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.times b{display:block;font:500 22px var(--f-mono)}
.times span{font-size:12px;color:var(--muted)}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.plan li:last-child{border:0}
.plan b{font:500 17px var(--f-mono);color:var(--gold)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.foot .tools button{font-size:12px;padding:6px 10px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
@media (prefers-reduced-motion:no-preference){.bar i,.c-bar{transition:all .25s}}
</style>

</head>

/* ---------- state ---------- */
var S=null, cur=null, saveTimer=null, MC={};
function newState(){
  var fa=(navigator.language||'').toLowerCase().indexOf('fa')===0;
  var s={v:2,lang:fa?'fa':'en',cal:fa?'j':'g',theme:'auto',tab:'habits',habits:[],checks:{},mood:{},sleep:{},tx:[],
    currency:fa?'تومان':'USD',open:0,age:25,weight:70,wake:'06:30',bed:'23:00',sample:true};
  S=s; cur=todayPos();
  var li=s.lang==='fa'?1:0;
  SEED_HABITS[li].forEach(function(n){s.habits.push({id:uid(),name:n})});
  seedSample();
  return s;
}
function seedSample(){
  var first=minfo(S.cal,cur.y,cur.m);
  if(first.days.filter(function(d){return d.iso<TODAY}).length<10)cur=shift(cur.y,cur.m,-1);
  var mi=minfo(S.cal,cur.y,cur.m), r=11;
  function rnd(){r=(r*9301+49297)%233280;return r/233280}
  S.habits.forEach(function(h,i){S.checks[h.id]={};mi.days.forEach(function(d){if(d.iso<TODAY&&rnd()<0.9-i*0.04)S.checks[h.id][d.iso]=1})});
  mi.days.forEach(function(d){if(d.iso<TODAY){S.mood[d.iso]=2+Math.floor(rnd()*4);S.sleep[d.iso]=Math.round((5.5+rnd()*3)*2)/2}});
  var k=S.cal==='j'?1000000:100, ds=mi.days.filter(function(d){return d.iso<=TODAY});
  if(ds.length<17)ds=mi.days;
  function pick(i){return (ds[Math.min(i,ds.length-1)]||mi.days[0]).iso}
  S.tx=[ {id:uid(),date:pick(0),type:'income',cat:'salary',amount:25*k,note:''},
    {id:uid(),date:pick(2),type:'expense',cat:'rent',amount:7*k,note:''},
    {id:uid(),date:pick(4),type:'expense',cat:'food',amount:1.6*k,note:''},
    {id:uid(),date:pick(8),type:'expense',cat:'transport',amount:0.7*k,note:''},
    {id:uid(),date:pick(10),type:'income',cat:'freelance',amount:6*k,note:''},
    {id:uid(),date:pick(12),type:'expense',cat:'bills',amount:1.1*k,note:''},
    {id:uid(),date:pick(Math.min(15,ds.length-1)),type:'capital',cat:'gold',amount:4*k,note:''} ];
  S.open=20*k;
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.habits&&o.tx){S=o;cur=todayPos();return}}}catch(e){}
  newState();save();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));setStatus(t('saved'))}catch(e){setStatus('—')}
}
function setStatus(s){var el=document.getElementById('status');if(el)el.textContent=s}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)}
function t(k){var v=T[k];return v?v[S.lang==='fa'?1:0]:k}
function L(a){return a[S.lang==='fa'?2:1]} /* category triples */

/* ---------- numbers ---------- */
var FD='۰۱۲۳۴۵۶۷۸۹';
function fd(s){s=String(s);return S.lang==='fa'?s.replace(/\d/g,function(d){return FD[+d]}).replace(/\./g,'٫'):s}
function norm(s){return String(s).replace(/[۰-۹]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)}).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)})}
function pn(s,int){s=norm(s);s=int?s.replace(/[,٬\s]/g,''):s.replace(/[٫,]/g,'.');return parseFloat(s)}
function money(n){var neg=n<0,s=Math.round(Math.abs(n)).toLocaleString('en-US');if(S.lang==='fa')s=fd(s).replace(/,/g,'٬');return (neg?'−':'')+s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hm(min){min=((Math.round(min)%1440)+1440)%1440;return fd(pad(Math.floor(min/60))+':'+pad(min%60))}
function toMin(v){var p=String(v||'0:0').split(':');return (+p[0])*60+(+p[1]||0)}

/* ---------- calendars ---------- */
var jf=null;
try{jf=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});if(jf.formatToParts(new Date(2026,2,25,12)).filter(function(p){return p.type==='year'})[0].value*1<1300)jf=null}catch(e){jf=null}
function jparts(dt){var o={};jf.formatToParts(dt).forEach(function(p){if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type]=parseInt(p.value,10)});return o}
function nextDay(dt){return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+1,12)}
function calOK(){return !!jf}
function todayPos(){
  if(S.cal==='j'&&jf){var p=jparts(now);return {y:p.year,m:p.month-1}}
  return {y:now.getFullYear(),m:now.getMonth()};
}
function minfo(cal,y,m){
  var k=cal+y+'-'+m;if(MC[k])return MC[k];
  var days=[],dt,i;
  if(cal==='j'&&jf){
    var off=m<6?m*31:186+(m-6)*30;
    dt=new Date(y+621,2,21+off-4,12);
    for(i=0;i<14;i++){var p=jparts(dt);if(p.year===y&&p.month===m+1&&p.day===1)break;dt=nextDay(dt)}
    while(days.length<32){var q=jparts(dt);if(q.year!==y||q.month!==m+1)break;days.push({iso:iso(dt),d:q.day,wd:dt.getDay()});dt=nextDay(dt)}
  }else{
    var n=new Date(y,m+1,0).getDate();
    for(i=1;i<=n;i++){dt=new Date(y,m,i,12);days.push({iso:iso(dt),d:i,wd:dt.getDay()})}
  }
  return MC[k]={days:days};
}
function calKind(){return (S.cal==='j'&&jf)?'j':'g'}
function mi(){return minfo(calKind(),cur.y,cur.m)}
function shift(y,m,k){var tt=y*12+m+k;return {y:Math.floor(tt/12),m:((tt%12)+12)%12}}
function weekStart(){return calKind()==='j'?6:0}
function monthName(m){return MN[calKind()][S.lang==='fa'?1:0][m]}

/* ---------- shared pieces ---------- */
function head(){
  return '<div class="top"><div class="brand"><h1>'+t('title')+'</h1><span>'+t('sub')+'</span></div><div class="tools">'+

function periodBar(){
  var ys='';for(var y=cur.y-4;y<=cur.y+4;y++)ys+='<option value="'+y+'"'+(y===cur.y?' selected':'')+'>'+fd(y)+'</option>';
  var ms=MN[calKind()][S.lang==='fa'?1:0].map(function(n,i){return '<option value="'+i+'"'+(i===cur.m?' selected':'')+'>'+n+'</option>'}).join('');
  return '<div class="period"><button data-act="prev">'+t('prev')+'</button><select id="sel-month" data-act="month" aria-label="'+t('month')+'">'+ms+'</select><select id="sel-year" data-act="year" aria-label="'+t('year')+'">'+ys+'</select><button data-act="next">'+t('next')+'</button><button data-act="today">'+t('thismonth')+'</button></div>';
}
function notice(){return '<div class="notice"><span>'+t('example')+'</span><button class="primary" data-act="clear">'+t('clear')+'</button></div>'}
function foot(){return '<div class="foot"><span id="status">'+t('saved')+'</span><span class="tools"><button data-act="export">'+t('export')+'</button><button data-act="import">'+t('import')+'</button></span></div>'}

/* ---------- habits ---------- */
function habitStats(){
  var d=mi().days,n=d.length,per=[],tot=0,daily=[];
  S.habits.forEach(function(h){var c=S.checks[h.id]||{},s=0;d.forEach(function(x){if(c[x.iso])s++});per.push({h:h,actual:s,goal:n,left:n-s,pct:n?s/n:0});tot+=s});
  d.forEach(function(x){var s=0;S.habits.forEach(function(h){if((S.checks[h.id]||{})[x.iso])s++});daily.push(S.habits.length?s/S.habits.length:0)});
  var mv=[],sv=[];d.forEach(function(x){if(S.mood[x.iso]>0)mv.push(S.mood[x.iso]);if(S.sleep[x.iso]>0)sv.push(S.sleep[x.iso])});
  return {per:per,tot:tot,goal:n*S.habits.length,daily:daily,mood:avg(mv),sleep:avg(sv),n:n,days:d};
}
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function ageGroup(){var a=+S.age||0;for(var i=0;i<AGE_GROUPS.length;i++)if(a>=AGE_GROUPS[i][1]&&a<AGE_GROUPS[i][2])return AGE_GROUPS[i];return AGE_GROUPS[7]}

function viewHabits(){
  return periodBar()+
   '<section class="panel"><div class="kpis" id="h-kpi"></div></section>'+
   '<section class="panel"><div class="band hd">'+t('daily')+'</div><div class="chartscroll"><svg class="chart" id="h-chart" viewBox="0 0 760 230" role="img"></svg></div></section>'+
   '<div class="gridwrap" id="gridwrap"><table class="g" id="grid"></table></div><p class="hint">'+t('hint_grid')+'</p>'+
   '<div class="bottom"><section class="panel"><div class="band hd">'+t('analysis')+'</div><div class="scroll"><table class="a" id="h-an"></table></div></section>'+
   '<div class="right"><section class="panel"><div class="band hd">'+t('monthtotal')+'</div><div class="donutbody"><svg id="h-donut" width="130" height="130" viewBox="0 0 100 100" role="img"></svg><div class="legend" id="h-legend"></div></div></section>'+
   '<section class="panel"><div class="band hd">'+t('top10')+'</div><ol class="rank" id="h-top"></ol></section></div></div>';
}
function buildGrid(){
  var st=habitStats(),days=st.days,ws=weekStart(),wk=[];
  days.forEach(function(x,i){if(i===0||x.wd===ws)wk.push(1);else wk[wk.length-1]++});
  var li=S.lang==='fa'?1:0,h='<thead><tr><th class="nm" rowspan="3">'+t('myhabits')+'</th>';
  wk.forEach(function(l,i){h+='<th class="wk" colspan="'+l+'">'+(l<3?fd(i+1):t('week')+' '+fd(i+1))+'</th>'});
  h+='</tr><tr>';days.forEach(function(x){h+='<th class="'+(x.iso===TODAY?'today':'')+'">'+WD[li][x.wd]+'</th>'});
  h+='</tr><tr>';days.forEach(function(x){h+='<th class="'+(x.iso===TODAY?'today':'')+'">'+fd(x.d)+'</th>'});
  h+='</tr></thead><tbody>';
  S.habits.forEach(function(hb){
    var c=S.checks[hb.id]||{};
    h+='<tr><th class="nm" scope="row"><div class="cellin"><input type="text" data-act="name" data-h="'+hb.id+'" value="'+esc(hb.name)+'" aria-label="'+t('habit')+'"><button class="del" data-act="delh" data-h="'+hb.id+'" aria-label="Delete">✕</button></div></th>';
    days.forEach(function(x){h+='<td class="d'+(x.iso===TODAY?' today':'')+'"><input type="checkbox" data-act="chk" data-h="'+hb.id+'" data-iso="'+x.iso+'"'+(c[x.iso]?' checked':'')+' aria-label="'+esc(hb.name)+' '+fd(x.d)+'"></td>'});
    h+='</tr>';
  });
  h+='<tr class="add"><td class="nm"><button data-act="addh">'+t('addhabit')+'</button></td><td colspan="'+days.length+'"></td></tr>';
  [['mood',t('mood')],['sleep',t('sleeph')]].forEach(function(r){
    h+='<tr><th class="nm" scope="row"><div class="cellin"><span style="padding:9px 10px;font-weight:500;font-size:14px">'+r[1]+'</span></div></th>';
    days.forEach(function(x){var v=S[r[0]][x.iso];h+='<td class="d'+(x.iso===TODAY?' today':'')+'"><input class="v" type="text" inputmode="decimal" data-act="val" data-k="'+r[0]+'" data-iso="'+x.iso+'" value="'+(v==null?'':fd(v))+'" aria-label="'+r[1]+' '+fd(x.d)+'"></td>'});
    h+='</tr>';
  });
  document.getElementById('grid').innerHTML=h+'</tbody>';
}
function updHabits(){
  var st=habitStats(),n=st.n,pct=st.goal?Math.round(st.tot/st.goal*100):0,g=ageGroup();
  document.getElementById('h-kpi').innerHTML=
   '<div><b>'+fd(pct)+'%</b><span>'+t('done')+'</span></div>'+
   '<div><b>'+(st.mood==null?'–':fd(st.mood.toFixed(1)))+'</b><span>'+t('avgmood')+'</span></div>'+
   '<div><b>'+(st.sleep==null?'–':fd(st.sleep.toFixed(1)))+'</b><span>'+t('avgsleep')+'</span><small>'+t('recommended')+': '+fd(g[3])+'–'+fd(g[4])+' '+t('hours')+'</small></div>';
  var W=760,H=230,Lm=40,R=12,Tp=14,B=44,pw=W-Lm-R,ph=H-Tp-B,bw=pw/n,s='',li=S.lang==='fa'?1:0;
  [0,25,50,75,100].forEach(function(v){var y=Tp+ph-ph*v/100;s+='<line class="c-grid" x1="'+Lm+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="c-axis" x="'+(Lm-6)+'" y="'+(y+3)+'" text-anchor="end">'+fd(v)+'%</text>'});
  st.daily.forEach(function(v,i){
    var x=st.days[i],h=ph*v,bx=Lm+i*bw+bw*.18,w=bw*.64,y=Tp+ph-h,cx=Lm+i*bw+bw/2;

     '<text class="c-lab" x="'+cx.toFixed(1)+'" y="'+(Tp+ph+13)+'" text-anchor="middle">'+WD[li][x.wd]+'</text><text class="c-lab" x="'+cx.toFixed(1)+'" y="'+(Tp+ph+26)+'" text-anchor="middle">'+fd(x.d)+'</text>';
  });
  document.getElementById('h-chart').innerHTML=s;
  var a='<thead><tr><th>'+t('habit')+'</th><th>'+t('goal')+'</th><th>'+t('actual')+'</th><th>'+t('left')+'</th><th>'+t('progress')+'</th><th>%</th></tr></thead><tbody>';
  st.per.forEach(function(p){a+='<tr><td>'+esc(p.h.name)+'</td><td>'+fd(p.goal)+'</td><td>'+fd(p.actual)+'</td><td>'+fd(p.left)+'</td><td><div class="bar"><i style="width:'+Math.round(p.pct*100)+'%"></i></div></td><td>'+fd(Math.round(p.pct*100))+'%</td></tr>'});

  document.getElementById('h-legend').innerHTML='<div><span class="sw" style="background:var(--accent)"></span>'+t('completed')+' <b>'+fd(st.tot)+'</b></div><div><span class="sw" style="background:var(--line)"></span>'+t('left')+' <b>'+fd(st.goal-st.tot)+'</b></div><div style="color:var(--muted)">'+t('goal')+' <b style="color:var(--ink)">'+fd(st.goal)+'</b></div>';
  var top=st.per.slice().sort(function(x,y){return y.pct-x.pct}).slice(0,10);
  document.getElementById('h-top').innerHTML=top.length?top.map(function(p,i){return '<li><span class="r">'+fd(i+1)+'</span><span class="t">'+esc(p.h.name)+'</span><span class="mono">'+fd(Math.round(p.pct*100))+'%</span></li>'}).join(''):'<li><span></span><span class="t">'+t('addfirst')+'</span><span></span></li>';
}

/* ---------- money ---------- */
function monthTx(info){var a=info.days[0].iso,b=info.days[info.days.length-1].iso;return S.tx.filter(function(x){return x.date>=a&&x.date<=b})}
function sums(list){var o={income:0,expense:0,capIn:0,capOut:0};list.forEach(function(x){if(x.type==='income')o.income+=x.amount;else if(x.type==='expense')o.expense+=x.amount;else if(x.cat==='withdraw')o.capOut+=x.amount;else o.capIn+=x.amount});return o}
function catLabel(type,key){var c=CATS[type].filter(function(x){return x[0]===key})[0];return c?L(c):key}
function catOptions(type,sel){return CATS[type].map(function(c){return '<option value="'+c[0]+'"'+(c[0]===sel?' selected':'')+'>'+L(c)+'</option>'}).join('')}
function viewMoney(){
  var info=mi(),list=monthTx(info),m=sums(list),cur$=esc(S.currency);
  var capAll=S.open+sums(S.tx).capIn-sums(S.tx).capOut, remain=m.income-m.expense-m.capIn+m.capOut;
  var rate=m.income?Math.round((m.capIn-m.capOut)/m.income*100):0;
  var tdIdx=info.days.map(function(d){return d.iso}).indexOf(TODAY);
  var dayOpts=info.days.map(function(d,i){return '<option value="'+d.iso+'"'+(i===(tdIdx<0?0:tdIdx)?' selected':'')+'>'+fd(d.d)+'</option>'}).join('');
  var h=periodBar()+
   '<section class="panel"><div class="kpis">'+
   '<div><b style="color:var(--good)">'+money(m.income)+'</b><span>'+t('income')+'</span></div>'+
   '<div><b style="color:var(--warn)">'+money(m.expense)+'</b><span>'+t('expense')+'</span></div>'+
   '<div><b style="color:'+(remain<0?'var(--bad)':'inherit')+'">'+money(remain)+'</b><span>'+t('remaining')+'</span></div>'+
   '<div><b>'+fd(rate)+'%</b><span>'+t('saverate')+'</span></div>'+
   '<div><b style="color:var(--accent)">'+money(capAll)+'</b><span>'+t('totalcap')+'</span><small>'+cur$+'</small></div></div></section>'+
   '<section class="panel"><div class="band hd">'+t('addtx')+'</div><div class="pad"><div class="txform">'+
   '<label>'+t('day')+'<select id="f-day">'+dayOpts+'</select></label>'+
   '<label>'+t('type')+'<select id="f-type" data-act="ftype"><option value="income">'+t('t_income')+'</option><option value="expense" selected>'+t('t_expense')+'</option><option value="capital">'+t('t_capital')+'</option></select></label>'+
   '<label>'+t('category')+'<select id="f-cat">'+catOptions('expense')+'</select></label>'+
   '<label>'+t('amount')+'<input type="text" id="f-amt" inputmode="decimal" placeholder="0"></label>'+
   '<label>'+t('note')+'<input type="text" id="f-note"></label>'+
   '<button class="primary" data-act="addtx">'+t('add')+'</button></div>'+
   '<div class="fields" style="margin-top:12px"><label>'+t('currency')+'<input type="text" data-act="currency" value="'+esc(S.currency)+'"></label><label>'+t('opening')+'<input type="text" inputmode="decimal" data-act="open" value="'+(S.open?money(S.open):'')+'" placeholder="0"></label></div></div></section>';
  /* trend */
  var rows=[];for(var k=5;k>=0;k--){var p=shift(cur.y,cur.m,-k),inf=minfo(calKind(),p.y,p.m),s=sums(monthTx(inf));rows.push({name:monthName(p.m),in:s.income,ex:s.expense,cap:s.capIn-s.capOut})}
  var mx=Math.max.apply(null,rows.map(function(r){return Math.max(r.in,r.ex,Math.abs(r.cap))}).concat([1]));
  var W=window.innerWidth<600?420:760,H=230,Lm=8,Tp=14,B=34,pw=W-Lm*2,ph=H-Tp-B,gw=pw/6,svg='';
  [0,.5,1].forEach(function(f){var y=Tp+ph-ph*f;svg+='<line class="c-grid" x1="'+Lm+'" x2="'+(W-Lm)+'" y1="'+y+'" y2="'+y+'"/>'});
  rows.forEach(function(r,i){
    [['c-in',r.in],['c-ex',r.ex],['c-cap',Math.max(r.cap,0)]].forEach(function(b,j){
      var hh=ph*b[1]/mx,x=Lm+i*gw+gw*.14+j*gw*.24;
      svg+='<rect class="'+b[0]+'" x="'+x.toFixed(1)+'" y="'+(Tp+ph-hh).toFixed(1)+'" width="'+(gw*.21).toFixed(1)+'" height="'+hh.toFixed(1)+'"><title>'+money(b[1])+'</title></rect>'});
    svg+='<text class="c-lab" x="'+(Lm+i*gw+gw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" style="font-size:11px">'+r.name+'</text>';
  });
  h+='<div class="two"><section class="panel"><div class="band hd">'+t('bycat')+'</div>'+catBars(list)+'</section>'+
   '<section class="panel"><div class="band hd">'+t('trend')+'</div><svg class="chart" viewBox="0 0 '+W+' 230" role="img">'+svg+'</svg><div class="legendrow"><span><i class="sw" style="background:var(--good)"></i>'+t('income')+'</span><span><i class="sw" style="background:var(--warn)"></i>'+t('expense')+'</span><span><i class="sw" style="background:var(--accent)"></i>'+t('capnet')+'</span></div></section></div>';
  list=list.slice().sort(function(a,b){return a.date<b.date?1:-1});
  var dayOf={};info.days.forEach(function(d){dayOf[d.iso]=d.d});
  h+='<section class="panel"><div class="band hd">'+t('txs')+'</div>'+(list.length?'<div class="scroll"><table class="tx"><thead><tr><th>'+t('day')+'</th><th>'+t('type')+'</th><th>'+t('category')+'</th><th>'+t('note')+'</th><th style="text-align:end">'+t('amount')+'</th><th></th></tr></thead><tbody>'+
   list.map(function(x){return '<tr><td class="n">'+fd(dayOf[x.date])+'</td><td><span class="pill '+x.type+'">'+t('t_'+x.type)+'</span></td><td>'+catLabel(x.type,x.cat)+'</td><td>'+esc(x.note||'')+'</td><td class="amt">'+(x.type==='expense'||x.cat==='withdraw'?'−':'+')+money(x.amount)+'</td><td><button data-act="deltx" data-id="'+x.id+'" aria-label="Delete">✕</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">'+t('notx')+'</div>')+'</section>';
  return h;
}
function catBars(list){
  var by={},tot=0;list.forEach(function(x){if(x.type==='expense'){by[x.cat]=(by[x.cat]||0)+x.amount;tot+=x.amount}});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(!keys.length)return '<div class="empty">—</div>';
  return '<div style="padding:8px 0">'+keys.map(function(k){var pc=by[k]/tot;return '<div class="catrow"><span>'+catLabel('expense',k)+'</span><div class="bar"><i style="width:'+Math.round(pc*100)+'%;background:var(--warn)"></i></div><span class="mono">'+money(by[k])+'</span></div>'}).join('')+'</div>';
}

/* ---------- sleep ---------- */
function viewSleep(){
  var g=ageGroup(),W=toMin(S.wake),B=toMin(S.bed),lat=15;
  var li=S.lang==='fa'?1:0;
  var h='<section class="panel"><div class="band hd">'+t('profile')+'</div><div class="pad"><div class="fields">'+
   '<label>'+t('age')+'<input type="text" inputmode="decimal" data-act="age" value="'+fd(S.age)+'"></label>'+
   '<label>'+t('weight')+'<input type="text" inputmode="decimal" data-act="weight" value="'+fd(S.weight)+'"></label>'+
   '<label>'+t('wake')+'<input type="time" data-act="wake" value="'+S.wake+'"></label>'+
   '<label>'+t('bed')+'<input type="time" data-act="bed" value="'+S.bed+'"></label></div>'+
   '<p class="hint">'+t('disclaimer')+'</p></div></section><div class="cards">';
  /* bedtime from wake */
  var cyc=[6,5,4,3];
  h+='<section class="panel"><div class="band hd">'+t('bedsug')+' · '+hm(W)+'</div><div class="pad"><div class="times">'+
   cyc.map(function(c){return '<div class="'+(c===5||c===6?'best':'')+'"><b>'+hm(W-c*90-lat)+'</b><span>'+fd(c)+' '+t('cycles')+' · '+fd(c*1.5)+' '+t('hours')+'</span></div>'}).join('')+'</div><p class="hint">'+t('bedsug_h')+'</p></div></section>';
  h+='<section class="panel"><div class="band hd">'+t('wakesug')+' · '+hm(B)+'</div><div class="pad"><div class="times">'+
   cyc.map(function(c){return '<div class="'+(c===5||c===6?'best':'')+'"><b>'+hm(B+lat+c*90)+'</b><span>'+fd(c)+' '+t('cycles')+' · '+fd(c*1.5)+' '+t('hours')+'</span></div>'}).join('')+'</div></div></section>';
  /* plan */
  var tc=Math.max(3,Math.min(6,Math.round((g[3]+g[4])/2/1.5)));
  var bed=W-tc*90-lat,litres=((+S.weight||70)*0.033).toFixed(1);
  h+='<section class="panel"><div class="band hd">'+t('plan')+'</div><div class="pad"><ul class="plan">'+
   [[W,'p_wake'],[W+30,'p_light'],[bed-480,'p_caf'],[bed-180,'p_meal'],[bed-60,'p_screen'],[bed,'p_bed']].map(function(r){return '<li><b>'+hm(r[0])+'</b><span>'+t(r[1])+'</span></li>'}).join('')+'</ul>'+
   '<p class="hint">💧 '+t('waterline').replace('{L}',fd(litres))+'</p></div></section>';
  /* table */
  h+='<section class="panel"><div class="band hd">'+t('recsleep')+'</div><div class="scroll"><table class="rec">'+AGE_GROUPS.map(function(r){return '<tr class="'+(r===g?'me':'')+'"><td>'+t('g_'+r[0])+'</td><td class="n">'+fd(r[3])+'–'+fd(r[4])+' '+t('hours')+'</td></tr>'}).join('')+'</table></div></section></div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var ws=document.getElementById('gridwrap'),sl=ws?ws.scrollLeft:0;
  var de=document.documentElement;de.lang=S.lang;de.dir=S.lang==='fa'?'rtl':'ltr';
  if(S.theme==='auto')de.removeAttribute('data-theme');else de.setAttribute('data-theme',S.theme);
  document.getElementById('app').innerHTML=head()+(S.sample?notice():'')+(S.tab==='habits'?viewHabits():S.tab==='money'?viewMoney():viewSleep())+foot();
  if(S.tab==='habits'){buildGrid();updHabits();var w2=document.getElementById('gridwrap');if(w2)w2.scrollLeft=sl}
}

/* ---------- events ---------- */
var app=document.getElementById('app');
function armed(b,label){
  if(b.dataset.armed)return true;
  b.dataset.armed='1';var o=b.textContent;b.textContent=label;b.style.opacity=1;
  setTimeout(function(){if(b.isConnected){b.textContent=o;delete b.dataset.armed}},2500);return false;
}
app.addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='lang'){S.lang=S.lang==='fa'?'en':'fa';if(S.sample){var i=S.lang==='fa'?1:0;S.habits.forEach(function(h,k){if(SEED_HABITS[i][k])h.name=SEED_HABITS[i][k]});S.currency=S.lang==='fa'?'تومان':'USD'}save();render()}
  else if(a==='cal'){S.cal=S.cal==='j'?'g':'j';cur=todayPos();save();render()}
  else if(a==='theme'){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];save();render()}
  else if(a==='tab'){S.tab=b.dataset.tab;save();render()}
  else if(a==='prev'){cur=shift(cur.y,cur.m,-1);render()}
  else if(a==='next'){cur=shift(cur.y,cur.m,1);render()}
  else if(a==='today'){cur=todayPos();render()}
  else if(a==='addh'){S.habits.push({id:uid(),name:t('newhabit')});save();buildGrid();updHabits();var ins=document.querySelectorAll('[data-act=name]');var l=ins[ins.length-1];if(l){l.focus();l.select()}}
  else if(a==='delh'){if(armed(b,t('delq'))){S.habits=S.habits.filter(function(h){return h.id!==b.dataset.h});delete S.checks[b.dataset.h];save();buildGrid();updHabits()}}
  else if(a==='deltx'){if(armed(b,'?')){S.tx=S.tx.filter(function(x){return x.id!==b.dataset.id});save();render()}}
  else if(a==='addtx'){
    var amt=pn(document.getElementById('f-amt').value,true);
    if(!(amt>0)){document.getElementById('f-amt').focus();return}
    S.tx.push({id:uid(),date:document.getElementById('f-day').value,type:document.getElementById('f-type').value,cat:document.getElementById('f-cat').value,amount:amt,note:document.getElementById('f-note').value.trim()});
    save();render();
  }
  else if(a==='clear'){S.checks={};S.mood={};S.sleep={};S.tx=[];S.open=0;S.sample=false;save();render()}
  else if(a==='export')exportData();
  else if(a==='import')document.getElementById('importfile').click();
});
app.addEventListener('change',function(e){
  var t0=e.target,a=t0.dataset.act;if(!a)return;
  if(a==='chk'){var c=S.checks[t0.dataset.h]||(S.checks[t0.dataset.h]={});if(t0.checked)c[t0.dataset.iso]=1;else delete c[t0.dataset.iso];save();updHabits()}
  else if(a==='name'){var hb=S.habits.filter(function(h){return h.id===t0.dataset.h})[0];if(hb){hb.name=t0.value.trim()||t('newhabit');S.sample=S.sample;save();updHabits()}}
  else if(a==='val'){
    var k=t0.dataset.k,v=pn(t0.value),i=t0.dataset.iso;
    if(!(v>0)){delete S[k][i];t0.value=''}else{v=k==='mood'?Math.min(5,Math.max(1,Math.round(v))):Math.min(24,v);S[k][i]=v;t0.value=fd(v)}
    save();updHabits();
  }
  else if(a==='month'){cur.m=+t0.value;render()}
  else if(a==='year'){cur.y=+t0.value;render()}
  else if(a==='ftype'){document.getElementById('f-cat').innerHTML=catOptions(t0.value)}
  else if(a==='currency'){S.currency=t0.value.trim()||'USD';save();render()}
  else if(a==='open'){var o=pn(t0.value,true);S.open=o>0?o:0;save();render()}
  else if(a==='age'){var ag=pn(t0.value);S.age=ag>=0?ag:25;save();render()}
  else if(a==='weight'){var w=pn(t0.value);S.weight=w>0?w:70;save();render()}
  else if(a==='wake'||a==='bed'){if(t0.value){S[a]=t0.value;save();render()}}
});
function exportData(){
  var data=JSON.stringify(S,null,2),fn='life-planner-backup-'+TODAY+'.json';
  function fallback(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){if(d)return d.save({filename:fn,data:data});fallback()}).catch(function(){})}else fallback();
}
document.getElementById('importfile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!o.habits||!o.tx)throw 0;S=o;cur=todayPos();save();render()}catch(x){setStatus(t('badfile'))}};
  r.readAsText(f);e.target.value='';
});

load();render();
})();
</script>
</body>
</html>
